name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      # Commit z gotowym plikiem APK nie ma budowac sam siebie.
      - 'dist/**'
  workflow_dispatch:

permissions:
  # Zbudowany APK jest dopisywany do katalogu dist/ na tej samej galezi.
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testy + APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: ''` jest istotne: domyslna lista akcji zawiera pakiet `tools`,
      # ktorego nie ma juz w repozytorium Android SDK, przez co krok sie wywraca.
      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Doinstaluj platforme i build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Zbuduj APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Przygotuj plik do pobrania
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/rainbow-trening.apk
          ls -lh dist/

      - name: Opublikuj APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: rainbow-trening-apk
          path: dist/rainbow-trening.apk
          if-no-files-found: error
          retention-days: 30

      - name: Dopisz APK do gałęzi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/rainbow-trening.apk
          if git diff --cached --quiet; then
            echo "APK bez zmian - nie ma czego commitowac."
          else
            git commit -m "build: APK z ${GITHUB_SHA::7} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Pokaż nieudane testy
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in app/build/test-results/*/TEST-*.xml; do
            if grep -q "<failure" "$f"; then
              found=1
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done
          [ "$found" = "0" ] && echo "Brak raportow z nieudanymi testami."
          exit 0
