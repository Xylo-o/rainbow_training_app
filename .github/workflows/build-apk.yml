name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testy + APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Zbuduj APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Przygotuj plik do pobrania
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/rainbow-trening.apk
          ls -lh dist/

      - name: Opublikuj APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: rainbow-trening-apk
          path: dist/rainbow-trening.apk
          if-no-files-found: error
          retention-days: 30

      - name: Opublikuj raporty z testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
